[package]
name = "stale-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
