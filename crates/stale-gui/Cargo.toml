[package]
name = "stale-gui"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "StaleUninstaller"
path = "src/main.rs"
# Unit tests live in the lib: a test harness built from this bin would carry the
# requireAdministrator manifest and fail to start unelevated (os error 740).
test = false

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
log = "0.4.34"
simplelog = "0.12.2"
stale-core = { path = "../stale-core" }
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"
